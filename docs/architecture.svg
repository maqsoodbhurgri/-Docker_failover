<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3a5f">Docker-Based Server Failover: Network Architecture</text>

  <!-- Docker host / network boundary -->
  <rect x="250" y="55" width="650" height="450" rx="10" fill="#f5f8fc" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="268" y="80" font-size="13" font-weight="bold" fill="#37474f">Docker host (Ubuntu) - bridge network "failover-net" 172.30.0.0/24</text>

  <!-- Client -->
  <rect x="30" y="240" width="150" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="105" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Client</text>
  <text x="105" y="292" text-anchor="middle" font-size="11" fill="#333">curl / browser</text>
  <text x="105" y="308" text-anchor="middle" font-size="11" fill="#333">probe.py (1 req / 50 ms)</text>

  <!-- Client -> Nginx -->
  <line x1="180" y1="280" x2="288" y2="280" stroke="#333" stroke-width="2" marker-end="url(#k)"/>
  <text x="234" y="268" text-anchor="middle" font-size="11" fill="#333">HTTP / TCP</text>
  <text x="234" y="300" text-anchor="middle" font-size="11" fill="#333">:18080</text>

  <!-- Nginx -->
  <rect x="290" y="230" width="190" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="385" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Nginx reverse proxy</text>
  <text x="385" y="278" text-anchor="middle" font-size="12" fill="#333">172.30.0.10</text>
  <text x="385" y="296" text-anchor="middle" font-size="11" fill="#333">host port 18080 -> 80</text>
  <text x="385" y="314" text-anchor="middle" font-size="11" fill="#333">(only exposed entry point)</text>

  <!-- Nginx -> Primary (solid green) -->
  <path d="M480 260 H570 V165 H658" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="578" y="156" font-size="11" fill="#2e7d32">normal traffic</text>

  <!-- Nginx -> Backup (dashed blue) -->
  <path d="M480 300 H570 V395 H658" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#b)"/>
  <text x="578" y="387" font-size="11" fill="#1565c0">failover (retry)</text>

  <!-- Primary -->
  <rect x="660" y="120" width="220" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Primary server (Flask)</text>
  <text x="770" y="166" text-anchor="middle" font-size="12" fill="#333">172.30.0.11 : 5000</text>
  <text x="770" y="186" text-anchor="middle" font-size="11" fill="#333">Docker HEALTHCHECK /health (2 s)</text>
  <text x="770" y="201" text-anchor="middle" font-size="10" fill="#666">no published host port</text>

  <!-- Backup -->
  <rect x="660" y="350" width="220" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="770" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Backup server (Flask)</text>
  <text x="770" y="396" text-anchor="middle" font-size="12" fill="#333">172.30.0.12 : 5000</text>
  <text x="770" y="416" text-anchor="middle" font-size="11" fill="#333">Docker HEALTHCHECK /health (2 s)</text>
  <text x="770" y="431" text-anchor="middle" font-size="10" fill="#666">no published host port</text>

  <!-- Passive health check note -->
  <line x1="385" y1="330" x2="385" y2="362" stroke="#8d6e63" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="290" y="362" width="200" height="106" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="390" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">Passive health check</text>
  <text x="390" y="401" text-anchor="middle" font-size="11" fill="#333">max_fails=1, fail_timeout=5s</text>
  <text x="390" y="418" text-anchor="middle" font-size="11" fill="#333">proxy_connect_timeout=1s</text>
  <text x="390" y="435" text-anchor="middle" font-size="11" fill="#333">proxy_next_upstream:</text>
  <text x="390" y="452" text-anchor="middle" font-size="11" fill="#333">error / timeout / 502-504</text>

  <!-- Trust boundary note -->
  <text x="268" y="492" font-size="11" fill="#546e7a">Trust boundary: backends are reachable only inside the Docker network, through Nginx.</text>

  <!-- Legend -->
  <rect x="30" y="400" width="200" height="90" rx="6" fill="#ffffff" stroke="#b0bec5"/>
  <text x="42" y="420" font-size="12" font-weight="bold" fill="#333">Legend</text>
  <line x1="42" y1="438" x2="82" y2="438" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="90" y="442" font-size="11" fill="#333">Primary path (data plane)</text>
  <line x1="42" y1="456" x2="82" y2="456" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="90" y="460" font-size="11" fill="#333">Failover path (on failure)</text>
  <line x1="42" y1="474" x2="82" y2="474" stroke="#8d6e63" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="90" y="478" font-size="11" fill="#333">Control / health logic</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
