events {}

http {
    upstream backend {
        server primary:5000 max_fails=1 fail_timeout=5s;
        server backup:5000 backup;
    }

    log_format failover '$time_iso8601 client=$remote_addr '
                        'upstream=$upstream_addr status=$status '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log failover;

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
